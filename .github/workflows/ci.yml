name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-policy:
    runs-on: ubuntu-latest
    env:
      REQUIRE_OPA: "1"
      OPA_VERSION: "1.22.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install OPA (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - name: Hygiene check (no secrets/local artifacts tracked)
        run: python scripts/check_hygiene.py

      - name: SC-007 checklist case count
        run: python scripts/check_sc007_case_count.py

      - name: OPA policy check (pinned)
        run: opa check specs/001-soc-triage-correlacao/contracts/policy

      - name: Pytest (full suite, OPA required)
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Pytest policy contract (OPA required)
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/contract/test_policy_opa_rego.py
